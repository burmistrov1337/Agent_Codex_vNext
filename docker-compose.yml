services:
  agent_codex_bot:
    build: .
    container_name: agent_codex_vnext_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.agent_codex:/app/.agent_codex
      - ./skills:/app/skills:ro
    command: ["python", "-m", "agent_codex.apps.cli.main", "telegram-bot", "--project-root", "/app"]
    healthcheck:
      test: ["CMD-SHELL", "python -m agent_codex.apps.cli.main doctor --project-root /app --json > /tmp/doctor.json"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: agent_codex_n8n
    restart: unless-stopped
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Novosibirsk}
      - TZ=${TZ:-Asia/Novosibirsk}
    volumes:
      - ./.docker/n8n:/home/node/.n8n
